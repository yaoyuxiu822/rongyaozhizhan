<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者课堂：荣耀之战</title>
    <style>
        /* 王者荣耀配色方案 */
        :root {
            --bg-gradient: linear-gradient(135deg, #0a1222 0%, #162a4d 100%);
            --gold-primary: #e1ad5f;
            --gold-light: #f3d59b;
            --card-bg: rgba(20, 35, 65, 0.8);
            --text-white: #e0e6ed;
            --accent-blue: #0084ff;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 动态星空背景 */
        .stars-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 云雾效果 */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            filter: blur(40px);
            animation: float 20s infinite;
        }

        @keyframes float {
            0% { transform: translateX(-100px) translateY(0); }
            50% { transform: translateX(calc(100vw + 100px)) translateY(-50px); }
            100% { transform: translateX(-100px) translateY(0); }
        }

        /* 顶部标题栏 */
        header {
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid var(--gold-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
            font-style: italic;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff, var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            background: rgba(255,255,255,0.1);
            border: 2px solid;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        /* 输入框颜色随段位变化 */
        input.rank-gray { border-color: #808080; box-shadow: 0 0 10px rgba(128, 128, 128, 0.3); }
        input.rank-silver { border-color: #c0c0c0; box-shadow: 0 0 10px rgba(192, 192, 192, 0.3); }
        input.rank-gold { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        input.rank-purple-light { border-color: #dda0dd; box-shadow: 0 0 10px rgba(221, 160, 221, 0.3); }
        input.rank-purple-dark { border-color: #9370db; box-shadow: 0 0 10px rgba(147, 112, 219, 0.3); }
        input.rank-blue { border-color: #4169e1; box-shadow: 0 0 10px rgba(65, 105, 225, 0.3); }
        input.rank-pink { border-color: #ff69b4; box-shadow: 0 0 10px rgba(255, 105, 180, 0.3); }
        input.rank-red { border-color: #dc143c; box-shadow: 0 0 10px rgba(220, 20, 60, 0.3); }

        button {
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 4px;
            border: 1px solid var(--gold-primary);
            background: var(--gold-primary);
            color: #1a1a1a;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        .btn-reset {
            background: transparent;
            color: #ff4d4d;
            border-color: #ff4d4d;
        }

        .btn-delete {
            background: transparent;
            color: #ff6b6b;
            border-color: #ff6b6b;
            font-size: 0.9em;
            padding: 6px 12px;
        }

        .btn-delete:hover {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete-all {
            background: transparent;
            color: #ff4757;
            border-color: #ff4757;
        }

        .btn-delete-all:hover {
            background: #ff4757;
            color: white;
        }

        .btn-export {
            background: rgba(65, 105, 225, 0.3);
            color: #4169e1;
            border-color: #4169e1;
        }

        .btn-export:hover {
            background: #4169e1;
            color: white;
        }

        .btn-import {
            background: rgba(50, 205, 50, 0.3);
            color: #32cd32;
            border-color: #32cd32;
        }

        .btn-import:hover {
            background: #32cd32;
            color: white;
        }

        .card-delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: rgba(255, 107, 107, 0.8);
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s;
        }

        .student-card:hover .card-delete-btn {
            opacity: 1;
        }

        .card-delete-btn:hover {
            background: #ff6b6b;
            transform: scale(1.1);
        }

        /* 主界面布局 */
        main {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 25px;
            overflow-y: auto; /* 主战场页面可上下滚动 */
        }

        /* 左侧管理卡片区 */
        #admin-panel {
            flex: 2.5;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            overflow-y: auto;
            padding-bottom: 50px;
        }

        /* 右侧控制面板 */
        #right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            border: 1px solid rgba(225, 173, 95, 0.6);
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .student-card {
            background: var(--card-bg);
            border: 1px solid rgba(225, 173, 95, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .student-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(225, 173, 95, 0.2);
        }

        .rank-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .student-name {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
            color: #fff;
        }

        .student-name-input {
            width: 75%;
            font-size: 0.95em;
            font-weight: bold;
            margin: 5px 0;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border: 3px solid;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .student-name-input:focus {
            outline: none;
            background: rgba(255,255,255,0.2);
        }

        /* 卡片内姓名框颜色随段位变化 */
        .student-name-input.rank-gray { border-color: #808080; box-shadow: 0 0 8px rgba(128, 128, 128, 0.3); }
        .student-name-input.rank-silver { border-color: #c0c0c0; box-shadow: 0 0 8px rgba(192, 192, 192, 0.3); }
        .student-name-input.rank-gold { border-color: #ffd700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
        .student-name-input.rank-purple-light { border-color: #dda0dd; box-shadow: 0 0 8px rgba(221, 160, 221, 0.3); }
        .student-name-input.rank-purple-dark { border-color: #9370db; box-shadow: 0 0 8px rgba(147, 112, 219, 0.3); }
        .student-name-input.rank-blue { border-color: #4169e1; box-shadow: 0 0 8px rgba(65, 105, 225, 0.3); }
        .student-name-input.rank-pink { border-color: #ff69b4; box-shadow: 0 0 8px rgba(255, 105, 180, 0.3); }
        .student-name-input.rank-red { border-color: #dc143c; box-shadow: 0 0 8px rgba(220, 20, 60, 0.3); }

        .rank-label {
            color: var(--gold-primary);
            font-size: 0.9em;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .star-box {
            font-size: 1.2em;
            margin-bottom: 15px;
            height: 25px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-star {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .btn-plus { 
            background: linear-gradient(#d4a574, #b8936a); 
            color: white; 
            box-shadow: 0 4px 8px rgba(184, 147, 106, 0.4);
        }
        .btn-minus { 
            background: linear-gradient(#8b6f47, #6b5635); 
            color: white; 
            box-shadow: 0 4px 8px rgba(107, 86, 53, 0.4);
        }
        .btn-star:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(184, 147, 106, 0.6);
        }

        /* 右侧排行榜区 */
        #leaderboard {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board-header {
            background: var(--gold-primary);
            color: #000;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        #board-list {
            overflow-y: auto;
            flex: 1;
        }

        .board-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: slideIn 0.4s ease-out;
        }

        .rank-number {
            width: 30px;
            font-style: italic;
            font-weight: bold;
            color: var(--gold-primary);
        }

        .board-name { flex: 1; padding-left: 10px; }
        .board-stars { color: var(--gold-light); font-weight: bold; }

        /* 动画特效 */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes levelUpEffect {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.5); border-color: #fff; }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .level-up { animation: levelUpEffect 0.8s ease-out; }

        /* 全屏晋升动画 */
        .promotion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .promotion-content {
            text-align: center;
            animation: promotionPulse 1.5s ease-out;
        }

        @keyframes promotionPulse {
            0% { 
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .promotion-title {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(to bottom, #fff, var(--gold-primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(225, 173, 95, 0.8);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(225, 173, 95, 0.8)); }
            50% { filter: drop-shadow(0 0 40px rgba(225, 173, 95, 1)); }
        }

        .promotion-name {
            font-size: 2.5em;
            color: var(--gold-light);
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(225, 173, 95, 0.6);
        }

        .promotion-rank {
            font-size: 1.8em;
            color: var(--gold-primary);
            margin-top: 10px;
            letter-spacing: 3px;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        /* 界面切换动画 */
        .view-container {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .view-container.hidden {
            opacity: 0;
            transform: translateX(-100%);
            pointer-events: none;
        }

        .view-container.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* 英雄觉醒界面 */
        #hero-awakening-view {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
        }

        #hero-awakening-view.show {
            display: flex;
        }

        .hero-awakening-header {
            min-height: 80px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid var(--gold-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            gap: 20px;
        }

        .hero-awakening-title-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .hero-awakening-header h1 {
            margin: 0;
            white-space: nowrap;
        }

        .hero-description-inline {
            flex: 1;
            color: #d4a574;
            font-size: 0.9em;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
            border: 1px solid rgba(212, 165, 116, 0.4);
            border-radius: 999px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-awakening-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 40px;
            overflow-y: auto;
        }

        .hero-pools-container {
            flex: 1;
            display: flex;
            gap: 20px;
        }

        .hero-pool {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--gold-primary);
            border-radius: 15px;
            overflow: hidden;
            min-height: 0;
        }

        .hero-pool-header {
            background: var(--gold-primary);
            color: #000;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .hero-pool-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .hero-card {
            background: var(--card-bg);
            border: 2px solid rgba(225, 173, 95, 0.3);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .hero-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(225, 173, 95, 0.4);
        }

        .hero-card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            background: rgba(255, 215, 0, 0.1);
        }

        .hero-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hero-img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        }

        .hero-name {
            font-size: 0.85em;
            color: var(--text-white);
            word-break: break-word;
        }

        .student-hero-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .student-hero-card {
            background: var(--card-bg);
            border: 2px solid rgba(225, 173, 95, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .student-hero-img {
            width: 120px;
            height: 140px;
            object-fit: contain;
            margin: 0 auto 8px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        }

        .student-hero-name {
            font-size: 0.9em;
            color: var(--gold-primary);
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .random-awaken-btn {
            background: linear-gradient(135deg, #d4a574, #b8936a);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            box-shadow: 0 4px 15px rgba(212, 165, 116, 0.4);
            transition: all 0.3s;
        }

        .random-awaken-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.6);
        }

        .random-awaken-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 抽奖闪烁动画 */
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .flashing {
            animation: flash 0.2s infinite;
        }

        .hero-pools-container.flashing {
            animation: flash 0.15s infinite;
        }

        /* 英雄选择弹窗 */
        .hero-select-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 11000;
        }

        .hero-select-modal.show {
            display: flex;
        }

        .hero-select-modal-content {
            width: 80%;
            max-width: 900px;
            max-height: 80vh;
            background: rgba(10, 18, 34, 0.95);
            border-radius: 15px;
            border: 2px solid var(--gold-primary);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .hero-select-grid {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .hero-select-title {
            font-size: 1.1em;
            color: var(--gold-light);
            text-align: center;
        }
    </style>
</head>
<body>
<!-- 动态背景 -->
<div class="stars-background" id="stars-bg"></div>

<header>
    <h1>荣耀之战 · 课堂赛季</h1>
    <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="input-group" style="flex-wrap: wrap;">
            <input type="text" id="stu-name" placeholder="召唤师姓名..." class="rank-gray">
            <select id="stu-gender" style="background: rgba(255,255,255,0.1); border: 1px solid var(--gold-primary); color: white; padding: 8px 10px; border-radius: 4px;">
                <option value="male">男生</option>
                <option value="female">女生</option>
            </select>
            <button onclick="addHero()">加入战场</button>
            <button onclick="showHeroAwakening()" style="background: linear-gradient(135deg, #d4a574, #b8936a); color: white; border: none;">开启英雄觉醒</button>
        </div>
        <div class="input-group" style="flex-wrap: wrap;">
            <button onclick="showImportDialog()" style="background: rgba(225, 173, 95, 0.3); color: var(--gold-primary);">批量导入</button>
            <button class="btn-delete" onclick="showDeleteAllDialog()">删除全部</button>
            <button class="btn-export" onclick="exportData()">导出数据</button>
            <button class="btn-import" onclick="showImportDataDialog()">导入数据</button>
            <button class="btn-reset" onclick="resetSeason()">开启新赛季</button>
        </div>
    </div>
</header>

<main id="main-view" class="view-container show">
    <div id="admin-panel"></div>

    <div id="leaderboard">
        <div class="board-header">🏆 荣耀排行榜 (TOP)</div>
        <div id="board-list"></div>
    </div>
</main>

<!-- 英雄觉醒界面 -->
<div id="hero-awakening-view" class="view-container hidden">
    <div class="hero-awakening-header">
        <div class="hero-awakening-title-row">
            <h1>⚔️ 英雄觉醒大厅 ⚔️</h1>
            <div class="hero-description-inline">
                青铜到黄金阶段，由于英雄灵魂尚未完全觉醒，以随机形态降临；达到铂金后，学生可凭借实力'感召'心仪的本命英雄。
            </div>
        </div>
        <button onclick="showMainView()" style="background: var(--gold-primary); color: #1a1a1a; border: none; padding: 10px 25px; font-weight: bold; border-radius: 5px; cursor: pointer;">返回主战场</button>
    </div>
    <div class="hero-awakening-content">
        <div id="random-awaken-section" style="text-align: center; margin-bottom: 20px;">
            <button class="random-awaken-btn" onclick="randomAwaken()" id="random-awaken-btn">🎲 随机觉醒</button>
        </div>

        <div class="hero-pools-container" id="hero-pools-container">
            <!-- 左侧：男英雄池（男生 + 对应英雄） -->
            <div class="hero-pool">
                <div class="hero-pool-header">⚔️ 男英雄池（男生 & 英雄）</div>
                <div class="student-hero-list" id="male-student-hero-list"></div>
            </div>

            <!-- 右侧：女英雄池（女生 + 对应英雄） -->
            <div class="hero-pool">
                <div class="hero-pool-header">⚔️ 女英雄池（女生 & 英雄）</div>
                <div class="student-hero-list" id="female-student-hero-list"></div>
            </div>
        </div>

</div>

    <div class="hero-select-modal-content">

    <h2 style="margin-top: 0; color: var(--gold-primary); text-align: center;">批量导入姓名</h2>
    <p style="color: rgba(255,255,255,0.7); font-size: 0.9em; margin-bottom: 15px;">每行一个学生：姓名+性别，用逗号或空格分隔，例如：张三,男 / 李四 女</p>
    <textarea id="import-names" placeholder="张三,男&#10;李四,女&#10;王五 男" style="width: 100%; min-height: 200px; background: rgba(255,255,255,0.1); border: 1px solid var(--gold-primary); color: white; padding: 10px; border-radius: 5px; font-family: inherit; font-size: 14px; resize: vertical;"></textarea>

<!-- 删除全部确认对话框 -->
<div id="delete-all-dialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 2px solid #ff4757; border-radius: 10px; padding: 30px; z-index: 1000; min-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);">

    <div style="display: flex; gap: 10px; justify-content: flex-end;">

        <button onclick="deleteAllStudents()" style="background: #ff4757; color: white; border-color: #ff4757;">确认删除</button>

<!-- 导入数据对话框 -->
<div id="import-data-dialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 2px solid #32cd32; border-radius: 10px; padding: 30px; z-index: 1000; min-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.7);">
    <h2 style="margin-top: 0; color: #32cd32; text-align: center;">导入数据</h2>
    <p style="color: rgba(255,255,255,0.7); font-size: 0.9em; margin-bottom: 15px;">粘贴导出的JSON数据</p>
    <textarea id="import-data" placeholder="粘贴JSON数据..." style="width: 100%; min-height: 200px; background: rgba(255,255,255,0.1); border: 1px solid #32cd32; color: white; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; resize: vertical;"></textarea>
    <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
        <button onclick="closeImportDataDialog()" style="background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.3);">取消</button>
        <button onclick="importData()" style="background: #32cd32; color: white;">确认导入</button>
    </div>
</div>

<script>
    // 1. 段位配置（按照原版游戏：III -> II -> I，数字越小越牛）
    const MAJOR_RANKS = ["新手青铜", "进阶白银", "精英黄金", "大师铂金", "璀璨钻石", "闪亮星耀", "巅峰王者", "传奇王者"];
    const SUB_RANKS = ["III", "II", "I"]; // 按照原版游戏：III级起步，I级最高（数字越小越牛）
    const STARS_PER_SUB = 3;

    // 2. 英雄配置
    const BASE_MALE_HEROES = [
        "紫杖灵徒", "赤焰斧卫", "猎原弓手", "苍狼骑士", "青野樵夫",
        "森林隐士", "影刃赛博", "银锋剑使", "叶隐武者", "暗影刺客"
    ];
    const BASE_FEMALE_HEROES = [
        "冰雪精灵", "守护甜心", "紫芽诗人", "虎岭战姬", "刺客猫女",
        "藤晶术士", "松果仙童", "羽翎风使", "粉羽灵姬", "双花萌灵"
    ];
    const ADVANCED_HEROES = [
        "御城战士", "沧溟咒术师", "屠戮者", "冰刃凝霜", "黑衣枪王",
        "赤焰蛮姬", "星咒法师", "铁甲战锤王", "紫影潜行者", "冰蓝刺客",
        "紫金双刃姬", "赤缨剑士", "焰剑焚天客", "白锋行者", "银甲战斧使"
    ];

    // 旧英雄名→新英雄名（兼容已保存数据）
    const HERO_NAME_MIGRATION = {
        "男英雄1":"紫杖灵徒","男英雄2":"赤焰斧卫","男英雄3":"猎原弓手","男英雄4":"苍狼骑士","男英雄5":"青野樵夫",
        "男英雄6":"森林隐士","男英雄7":"影刃赛博","男英雄8":"银锋剑使","男英雄9":"叶隐武者","男英雄10":"暗影刺客",
        "女英雄1":"冰雪精灵","女英雄2":"守护甜心","女英雄3":"紫芽诗人","女英雄4":"虎岭战姬","女英雄5":"刺客猫女",
        "女英雄6":"藤晶术士","女英雄7":"松果仙童","女英雄8":"羽翎风使","女英雄9":"粉羽灵姬","女英雄10":"双花萌灵",
        "高阶英雄1":"御城战士","高阶英雄2":"沧溟咒术师","高阶英雄3":"屠戮者","高阶英雄4":"冰刃凝霜","高阶英雄5":"黑衣枪王",
        "高阶英雄6":"赤焰蛮姬","高阶英雄7":"星咒法师","高阶英雄8":"铁甲战锤王","高阶英雄9":"紫影潜行者","高阶英雄10":"冰蓝刺客",
        "高阶英雄11":"紫金双刃姬","高阶英雄12":"赤缨剑士","高阶英雄13":"焰剑焚天客","高阶英雄14":"白锋行者","高阶英雄15":"银甲战斧使"
    };

    let students = JSON.parse(localStorage.getItem('wangzhe_data')) || [];
    
    // 初始化学生性别 + 英雄名迁移（旧名→新名）
    students.forEach(s => {
        if (!s.gender) {
            s.gender = Math.random() > 0.5 ? 'male' : 'female';
        }
        if (!s.hero) {
            s.hero = null;
        } else if (HERO_NAME_MIGRATION[s.hero]) {
            s.hero = HERO_NAME_MIGRATION[s.hero];
        }
    });

    // 2. 核心进阶逻辑
    function getPlayerStatus(totalStars) {
        let stars = Math.max(0, totalStars);
        
        // 计算当前处于第几个小段位（从0开始计）
        let subLevelIndex = Math.floor(stars / STARS_PER_SUB);
        let currentStars = stars % STARS_PER_SUB;

        // 计算大段位索引
        let majorIndex = Math.floor(subLevelIndex / 3);
        let subIndex = subLevelIndex % 3;

        // 封顶处理（非凡王者 I 之后不再增加段位，只加星）
        if (majorIndex >= MAJOR_RANKS.length) {
            majorIndex = MAJOR_RANKS.length - 1;
            subIndex = 2; // 固定在 I（最高级）
            currentStars = STARS_PER_SUB + (stars - (MAJOR_RANKS.length * 3 * STARS_PER_SUB - STARS_PER_SUB));
        }

        return {
            major: MAJOR_RANKS[majorIndex],
            sub: SUB_RANKS[subIndex],
            stars: currentStars,
            img: `${MAJOR_RANKS[majorIndex]}.png`
        };
    }

    // 获取输入框颜色类名
    function getInputRankClass(majorIndex) {
        const classes = ['rank-gray', 'rank-silver', 'rank-gold', 'rank-purple-light', 'rank-purple-dark', 'rank-blue', 'rank-pink', 'rank-red'];
        return classes[majorIndex] || 'rank-gray';
    }

        // 更新顶部输入框颜色（根据最高段位）
        function updateInputColor() {
        const input = document.getElementById('stu-name');
        if (!input) return;
        
        // 获取当前最高段位（用于顶部输入框颜色）
        let maxMajorIndex = 0;
        if (students.length > 0) {
            const maxStars = Math.max(...students.map(s => s.stars));
            const status = getPlayerStatus(maxStars);
            maxMajorIndex = MAJOR_RANKS.indexOf(status.major);
        }
        
        // 移除所有颜色类
        input.className = input.className.replace(/rank-\w+/g, '').trim();
        // 添加新颜色类
        input.classList.add(getInputRankClass(maxMajorIndex));
    }

    // 3. 界面渲染
    function render() {
        localStorage.setItem('wangzhe_data', JSON.stringify(students));
        
        // 渲染操作区
        const panel = document.getElementById('admin-panel');
        panel.innerHTML = students.map(s => {
            const status = getPlayerStatus(s.stars);
            const majorIndex = MAJOR_RANKS.indexOf(status.major);
            const rankClass = getInputRankClass(majorIndex);
            return `
                <div class="student-card" id="card-${s.id}">
                    <button class="card-delete-btn" onclick="deleteStudent(${s.id})" title="删除">×</button>
                    <img src="${status.img}" class="rank-img" alt="Rank" onerror="this.src='https://via.placeholder.com/100/142341/e1ad5f?text=${status.major}'">
                    <input type="text" class="student-name-input ${rankClass}" value="${s.name}" 
                           onchange="updateStudentName(${s.id}, this.value)" 
                           onblur="updateStudentName(${s.id}, this.value)"
                           data-student-id="${s.id}">
                    <div class="rank-label">${status.major} ${status.sub}</div>
                    <div class="star-box">${'⭐'.repeat(status.stars) || '<span style="opacity:0.2">☆</span>'}</div>
                    <div class="actions">
                        <button class="btn-star btn-minus" onclick="changeStar(${s.id}, -1)">-</button>
                        <button class="btn-star btn-plus" onclick="changeStar(${s.id}, 1)">+</button>
                    </div>
                </div>
            `;
        }).join('');
        
        // 更新输入框颜色
        updateInputColor();

        // 渲染排行榜
        const list = document.getElementById('board-list');
        const sorted = [...students].sort((a,b) => b.stars - a.stars);
        list.innerHTML = sorted.map((s, i) => {
            const status = getPlayerStatus(s.stars);
            return `
                <div class="board-item">
                    <span class="rank-number">${i+1}</span>
                    <span class="board-name">${s.name}</span>
                    <span style="font-size:0.8em; opacity:0.7; margin-right:10px;">${status.major}</span>
                    <span class="board-stars">★ ${s.stars}</span>
                </div>
            `;
        }).join('');
    }

    // 4. 操作函数
    function addHero() {
        const name = document.getElementById('stu-name').value.trim();
        const genderSelect = document.getElementById('stu-gender');
        const gender = genderSelect ? genderSelect.value : 'male';
        if(!name) return;
        students.push({ id: Date.now(), name: name, stars: 0, gender, hero: null });
        document.getElementById('stu-name').value = '';
        render();
    }

    // 更新学生姓名
    function updateStudentName(id, newName) {
        const s = students.find(x => x.id === id);
        if(s && newName && newName.trim()) {
            s.name = newName.trim();
            localStorage.setItem('wangzhe_data', JSON.stringify(students));
            // 只更新排行榜，不重新渲染整个卡片（保持输入框焦点）
            updateLeaderboard();
        } else if(s && (!newName || !newName.trim())) {
            // 如果姓名为空，恢复原值
            const input = document.querySelector(`input[data-student-id="${id}"]`);
            if(input) input.value = s.name;
        }
    }

    // 更新排行榜（不重新渲染整个界面）
    function updateLeaderboard() {
        const list = document.getElementById('board-list');
        const sorted = [...students].sort((a,b) => b.stars - a.stars);
        list.innerHTML = sorted.map((s, i) => {
            const status = getPlayerStatus(s.stars);
            return `
                <div class="board-item">
                    <span class="rank-number">${i+1}</span>
                    <span class="board-name">${s.name}</span>
                    <span style="font-size:0.8em; opacity:0.7; margin-right:10px;">${status.major}</span>
                    <span class="board-stars">★ ${s.stars}</span>
                </div>
            `;
        }).join('');
    }

    // 更新单个卡片的姓名框颜色和星星显示
    function updateCardNameInputColor(id) {
        const s = students.find(x => x.id === id);
        if(!s) return;
        
        const status = getPlayerStatus(s.stars);
        const majorIndex = MAJOR_RANKS.indexOf(status.major);
        const rankClass = getInputRankClass(majorIndex);
        
        const input = document.querySelector(`input[data-student-id="${id}"]`);
        if(input) {
            // 移除所有颜色类
            input.className = input.className.replace(/rank-\w+/g, '').trim();
            // 添加新颜色类
            input.classList.add('student-name-input', rankClass);
        }
        
        // 更新段位标签、图标和星星显示
        const card = document.getElementById(`card-${id}`);
        if(card) {
            // 更新段位标签
            const rankLabel = card.querySelector('.rank-label');
            if(rankLabel) {
                rankLabel.textContent = `${status.major} ${status.sub}`;
            }
            
            // 更新图标（重要：实时更新图片）
            const rankImg = card.querySelector('.rank-img');
            if(rankImg) {
                rankImg.src = status.img;
                // 如果图片加载失败，使用占位符
                rankImg.onerror = function() {
                    this.src = `https://via.placeholder.com/100/142341/e1ad5f?text=${status.major}`;
                };
            }
            
            // 更新星星显示
            const starBox = card.querySelector('.star-box');
            if(starBox) {
                starBox.innerHTML = status.stars > 0 ? '⭐'.repeat(status.stars) : '<span style="opacity:0.2">☆</span>';
            }
        }
    }

    function changeStar(id, num) {
        const s = students.find(x => x.id === id);
        if(s) {
            const oldStatus = getPlayerStatus(s.stars);
            const oldMajor = oldStatus.major;
            const oldSub = oldStatus.sub;
            
            s.stars = Math.max(0, s.stars + num);
            
            const newStatus = getPlayerStatus(s.stars);
            
            // 保存数据
            localStorage.setItem('wangzhe_data', JSON.stringify(students));
            
            // 更新卡片显示（包括姓名框颜色、星星、段位标签）
            updateCardNameInputColor(id);
            
            // 更新排行榜
            updateLeaderboard();

            // 升级特效（只有加星且段位提升时才触发）
            if(num > 0 && (newStatus.major !== oldMajor || newStatus.sub !== oldSub)) {
                const card = document.getElementById(`card-${id}`);
                if(card) {
                    card.classList.add('level-up');
                    setTimeout(() => card.classList.remove('level-up'), 800);
                }
                
                // 触发全屏晋升动画
                showPromotionAnimation(s.name, newStatus.major, newStatus.sub);
            }
        }
    }

    // 全屏晋升动画
    function showPromotionAnimation(name, major, sub) {
        const overlay = document.createElement('div');
        overlay.className = 'promotion-overlay';
        overlay.innerHTML = `
            <div class="promotion-content">
                <div class="promotion-title">🎉 恭喜晋升 🎉</div>
                <div class="promotion-name">${name}</div>
                <div class="promotion-rank">${major} ${sub}</div>
            </div>
        `;
        document.body.appendChild(overlay);
        
        setTimeout(() => {
            overlay.style.animation = 'fadeIn 0.3s ease-out reverse';
            setTimeout(() => {
                document.body.removeChild(overlay);
            }, 300);
        }, 2000);
    }

    // 批量导入功能
    function showImportDialog() {
        document.getElementById('import-dialog').style.display = 'block';
        document.getElementById('import-names').focus();
    }

    function closeImportDialog() {
        document.getElementById('import-dialog').style.display = 'none';
        document.getElementById('import-names').value = '';
    }

    function importNames() {
        const text = document.getElementById('import-names').value.trim();
        if (!text) {
            alert('请输入姓名和性别列表');
            return;
        }
        
        const lines = text.split('\n')
            .map(n => n.trim())
            .filter(n => n.length > 0);
        
        if (lines.length === 0) {
            alert('未检测到有效姓名');
            return;
        }
        
        let added = 0;
        lines.forEach(line => {
            const parts = line.split(/[,，\s]+/).filter(p => p.length > 0);
            if (parts.length === 0) return;
            const name = parts[0];
            let genderText = parts[1] || '';
            genderText = genderText.trim();
            let gender;
            if (genderText === '女' || genderText === '女生' || genderText === '女生组') {
                gender = 'female';
            } else if (genderText === '男' || genderText === '男生' || genderText === '男生组') {
                gender = 'male';
            } else {
                // 如果性别未填写或无法识别，默认男生
                gender = 'male';
            }

            // 检查是否已存在
            if (!students.some(s => s.name === name)) {
                students.push({ id: Date.now() + Math.random(), name: name, stars: 0, gender, hero: null });
                added++;
            }
        });
        
        closeImportDialog();
        render();
        
        if (added > 0) {
            alert(`成功导入 ${added} 名学生！`);
        } else {
            alert('所有姓名都已存在，未添加新学生');
        }
    }

    function resetSeason() {
        const confirmed = confirm("确定要终结当前赛季吗？所有英雄将回归青铜 III 起点！");
        if(confirmed) {
            // 重置所有学生的星星数为0（回归青铜III）
            students = students.map(s => ({ ...s, stars: 0 }));
            // 保存到本地存储
            localStorage.setItem('wangzhe_data', JSON.stringify(students));
            // 重新渲染界面
            render();
        }
    }

    // 删除单个学生
    function deleteStudent(id) {
        if (confirm('确定要删除这名学生吗？')) {
            students = students.filter(s => s.id !== id);
            render();
        }
    }

    // 显示删除全部对话框
    function showDeleteAllDialog() {
        if (students.length === 0) {
            alert('当前没有学生');
            return;
        }
        document.getElementById('delete-all-dialog').style.display = 'block';
    }

    function closeDeleteAllDialog() {
        document.getElementById('delete-all-dialog').style.display = 'none';
    }

    // 删除全部学生
    function deleteAllStudents() {
        students = [];
        localStorage.setItem('wangzhe_data', JSON.stringify(students));
        closeDeleteAllDialog();
        render();
        alert('已删除所有学生');
    }

    // 导出数据
    function exportData() {
        const data = {
            students: students,
            exportTime: new Date().toISOString(),
            version: '1.0'
        };
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `王者荣耀数据_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('数据导出成功！');
    }

    // 显示导入数据对话框
    function showImportDataDialog() {
        document.getElementById('import-data-dialog').style.display = 'block';
        document.getElementById('import-data').focus();
    }

    function closeImportDataDialog() {
        document.getElementById('import-data-dialog').style.display = 'none';
        document.getElementById('import-data').value = '';
    }

    // 导入数据
    function importData() {
        const text = document.getElementById('import-data').value.trim();
        if (!text) {
            alert('请输入JSON数据');
            return;
        }
        
        try {
            const data = JSON.parse(text);
            if (data.students && Array.isArray(data.students)) {
                if (confirm(`确定要导入 ${data.students.length} 名学生的数据吗？这将覆盖当前数据！`)) {
                    students = data.students;
                    localStorage.setItem('wangzhe_data', JSON.stringify(students));
                    closeImportDataDialog();
                    render();
                    alert('数据导入成功！');
                }
            } else {
                alert('数据格式不正确，请检查JSON格式');
            }
        } catch (e) {
            alert('JSON格式错误：' + e.message);
        }
    }

    // 创建动态背景
    function createBackground() {
        const bg = document.getElementById('stars-bg');
        
        // 创建星星
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            bg.appendChild(star);
        }
        
        // 创建云雾
        for (let i = 0; i < 5; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            cloud.style.width = (Math.random() * 300 + 200) + 'px';
            cloud.style.height = (Math.random() * 150 + 100) + 'px';
            cloud.style.left = Math.random() * 100 + '%';
            cloud.style.top = Math.random() * 100 + '%';
            cloud.style.animationDelay = Math.random() * 20 + 's';
            cloud.style.animationDuration = (Math.random() * 10 + 20) + 's';
            bg.appendChild(cloud);
        }
    }

    // ========== 英雄觉醒功能 ==========
    
    // 界面切换
    function showHeroAwakening() {
        // 隐藏主战场（包括顶部 header），只显示英雄觉醒大厅
        const header = document.querySelector('header');
        if (header) header.style.display = 'none';

        const mainView = document.getElementById('main-view');
        const heroView = document.getElementById('hero-awakening-view');
        if (mainView && heroView) {
            mainView.style.display = 'none';
            heroView.style.display = 'flex';
            heroView.classList.remove('hidden');
            heroView.classList.add('show');
        }

        renderHeroAwakening();
    }

    function showMainView() {
        const header = document.querySelector('header');
        if (header) header.style.display = 'flex';

        const mainView = document.getElementById('main-view');
        const heroView = document.getElementById('hero-awakening-view');
        if (mainView && heroView) {
            heroView.style.display = 'none';
            mainView.style.display = 'flex';
            mainView.classList.remove('hidden');
            mainView.classList.add('show');
        }
    }

    // 渲染英雄觉醒界面
    function renderHeroAwakening() {
        renderStudentHeroListsByGender();
        updateRandomAwakenButton();
        updateHeroCardStates();
    }

    // 渲染按性别分组的学生英雄列表
    function renderStudentHeroListsByGender() {
        const maleList = document.getElementById('male-student-hero-list');
        const femaleList = document.getElementById('female-student-hero-list');

        const maleStudents = students.filter(s => s.gender === 'male' || !s.gender);
        const femaleStudents = students.filter(s => s.gender === 'female');

        maleList.innerHTML = maleStudents.map(buildStudentHeroCard).join('');
        femaleList.innerHTML = femaleStudents.map(buildStudentHeroCard).join('');
    }

    // 生成单个学生-英雄卡片 HTML（姓名与英雄名同一行：小明 紫杖灵徒）
    function buildStudentHeroCard(s) {
        const status = getPlayerStatus(s.stars);
        const canSelect = MAJOR_RANKS.indexOf(status.major) >= 3; // 铂金及以上
        const heroDisplay = s.hero ? s.hero : '未觉醒';
        const heroImg = s.hero ? `${s.hero}.png` : 'https://via.placeholder.com/120/142341/e1ad5f?text=未觉醒';

        return `
            <div class="student-hero-card" data-student-id="${s.id}">
                <div class="student-hero-name">${s.name}${s.hero ? '  ' + heroDisplay : ''}</div>
                <div style="font-size: 0.75em; color: rgba(255,255,255,0.6); margin-bottom: 8px;">
                    ${status.major} ${status.sub}
                </div>
                <img src="${heroImg}" class="student-hero-img" alt="${heroDisplay}"
                     onerror="this.src='https://via.placeholder.com/120/142341/e1ad5f?text=${heroDisplay}'">
                ${canSelect ? `<div style="font-size: 0.7em; color: #dda0dd; margin-top: 5px; cursor: pointer;" onclick="openHeroSelectModal(${s.id})">可自主选择</div>` : ''}
            </div>
        `;
    }

    // 随机觉醒
    function randomAwaken() {
        if (students.length === 0) {
            alert('请先添加学生！');
            return;
        }

        const btn = document.getElementById('random-awaken-btn');
        const container = document.getElementById('hero-pools-container');
        btn.disabled = true;
        container.classList.add('flashing');

        // 检查哪些学生需要随机分配（青铜到黄金）
        const needRandom = students.filter(s => {
            const status = getPlayerStatus(s.stars);
            return MAJOR_RANKS.indexOf(status.major) < 3; // 青铜、白银、黄金
        });

        if (needRandom.length === 0) {
            alert('所有学生都已达到铂金及以上，请使用自主选择功能！');
            btn.disabled = false;
            container.classList.remove('flashing');
            return;
        }

        // 确保20个基础角色都被分配
        const allBaseHeroes = [...BASE_MALE_HEROES, ...BASE_FEMALE_HEROES];
        const shuffledBaseHeroes = [...allBaseHeroes].sort(() => Math.random() - 0.5);
        
        // 分离需要分配的男生和女生
        const needRandomMales = needRandom.filter(s => s.gender === 'male' || !s.gender);
        const needRandomFemales = needRandom.filter(s => s.gender === 'female');
        
        // 确保每个基础角色都被分配
        // 先为每个基础角色分配一个学生
        shuffledBaseHeroes.forEach((hero, index) => {
            const isMaleHero = BASE_MALE_HEROES.includes(hero);
            const targetStudents = isMaleHero ? needRandomMales : needRandomFemales;
            
            if (targetStudents.length > 0) {
                const studentIndex = index % targetStudents.length;
                const student = targetStudents[studentIndex];
                if (!student.hero) {
                    student.hero = hero;
                }
            }
        });
        
        // 为还没有分配英雄的学生随机分配
        needRandom.forEach(s => {
            if (!s.hero) {
                const pool = s.gender === 'female' ? BASE_FEMALE_HEROES : BASE_MALE_HEROES;
                s.hero = pool[Math.floor(Math.random() * pool.length)];
            }
        });

        // 闪烁动画持续2秒
        setTimeout(() => {
            container.classList.remove('flashing');
            btn.disabled = false;
            localStorage.setItem('wangzhe_data', JSON.stringify(students));
            renderStudentHeroListsByGender();
            alert(`成功为 ${needRandom.length} 名学生随机分配英雄！`);
        }, 2000);
    }

    // 打开英雄选择弹窗（铂金及以上）
    function openHeroSelectModal(studentId) {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const status = getPlayerStatus(student.stars);
        const canSelect = MAJOR_RANKS.indexOf(status.major) >= 3;
        if (!canSelect) {
            alert('需要达到铂金及以上段位才能自主选择英雄！');
            return;
        }

        const modal = document.getElementById('hero-select-modal');
        const titleEl = document.getElementById('hero-select-title');
        const grid = document.getElementById('hero-select-grid');

        titleEl.textContent = `为 ${student.name} 选择本命英雄`;

        const isFemale = student.gender === 'female';
        const basePool = isFemale ? BASE_FEMALE_HEROES : BASE_MALE_HEROES;
        const canUseAdvanced = MAJOR_RANKS.indexOf(status.major) >= 3;
        const heroPool = canUseAdvanced ? [...basePool, ...ADVANCED_HEROES] : basePool;

        grid.innerHTML = heroPool.map(hero => `
            <div class="hero-card" data-hero="${hero}" onclick="assignHeroToStudent(${studentId}, '${hero}')">
                <img src="${hero}.png" class="hero-img" alt="${hero}"
                     onerror="this.src='https://via.placeholder.com/80/142341/e1ad5f?text=${hero}'">
                <div class="hero-name">${hero}</div>
            </div>
        `).join('');

        modal.classList.add('show');
    }

    function closeHeroSelectModal() {
        const modal = document.getElementById('hero-select-modal');
        modal.classList.remove('show');
    }

    function assignHeroToStudent(studentId, heroName) {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        student.hero = heroName;
        localStorage.setItem('wangzhe_data', JSON.stringify(students));
        renderStudentHeroListsByGender();
        updateHeroCardSelection();
        closeHeroSelectModal();
    }

    // 更新英雄卡片选中状态
    function updateHeroCardSelection() {
        const cards = document.querySelectorAll('.hero-card');
        cards.forEach(card => {
            card.classList.remove('selected');
            const hero = card.getAttribute('data-hero');
            const hasStudent = students.some(s => s.hero === hero);
            if (hasStudent) {
                card.classList.add('selected');
            }
        });
    }

    // 更新随机觉醒按钮状态
    function updateRandomAwakenButton() {
        const btn = document.getElementById('random-awaken-btn');
        const needRandom = students.filter(s => {
            const status = getPlayerStatus(s.stars);
            return MAJOR_RANKS.indexOf(status.major) < 3;
        });
        
        if (needRandom.length === 0) {
            btn.style.display = 'none';
        } else {
            btn.style.display = 'block';
        }
    }

    // 初始化
    createBackground();
    render();
</script>
</body>
</html>
